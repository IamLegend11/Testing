name: Testing Pipeline

on:
  workflow_dispatch:

jobs:
  My_setup:
    runs-on: ubuntu-latest
    steps:
      - name: Getting My Repo
        uses: actions/checkout@v4
      - name: System Info
        run: | 
          pwd
          ls -la
          echo "Hello from GitHub Actions"
      - name: Creating New DIR
        run: mkdir practice
      - name: Getting into new DIR and create file
        working-directory: practice
        run: | 
          pwd
          touch kali.txt && echo "Hi there from Kali.txt" >> kali.txt
          ls -la
      - name: Creating ENV Variable
        env:
          MY_NAME: AHMED
        run: echo "My name is $MY_NAME"
      - name: SetUp NodeJS
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22.x
      - name: Check NodeJS Version
        run: |
          node --version
          npm --version
      - name: Install Dependencies
        run: npm install
      - name: Testing Node
        run: |
          echo "Start Testing"
          npm test
          sleep 1
          echo "Test has finished with exit code $?"

  Build_Stage:
    runs-on: ubuntu-latest
    needs: My_setup
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Making a docker
        run: |
          touch dockerfile
          files=package*json
          echo -e "FROM node:22\nWORKDIR /app\nCOPY $files .\nRUN npm install\nCOPY . .\nCMD ["npm","test"]" >> dockerfile
      - name: Building Image
        run: |
          docker build --tag first-test:v1 .
          docker images

          
