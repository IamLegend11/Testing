      fail-fast: false
      matrix:
        oss: [ubuntu-latest,windows-latest]
        node-version: [14.x,22.x]
    runs-on: ${{ matrix.oss }}
    steps:
    - uses: actions/setup-node@v3.6.0
      with:
        node-version: ${{matrix.node-version}}
    - name: Testing shell
      run: echo "Meow is the best"
    - name: Checking npm
      run: |
        echo "Meow is here"
        ls -la .
            
  
  
